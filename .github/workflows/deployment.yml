name: Deploy Storybook to GitHub Pages

on:
  push:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Important for Git history

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook
        env:
          NODE_ENV: production

      - name: Create .nojekyll file
        run: touch storybook-static/.nojekyll
        shell: bash

      - name: Fix base path in HTML files
        run: |
          find storybook-static -name "*.html" -exec sed -i 's|="\/assets\/|="\/ui-component\/assets\/|g' {} \;
          find storybook-static -name "*.js" -exec sed -i 's|\"\/assets\/|\"\/ui-component\/assets\/|g' {} \;
        shell: bash

      - name: Check Storybook build
        run: |
          if [ -f "storybook-static/index.html" ]; then
            echo "✅ Storybook build successful"
            echo "Contents of storybook-static directory:"
            ls -la storybook-static/
          else
            echo "❌ Storybook build failed - index.html not found"
            exit 1
          fi
        shell: bash

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: storybook-static # The folder storybook builds to
          branch: gh-pages # The branch to deploy to
          clean: true # Automatically remove deleted files from the deployment
